plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.16.3'
}

def modRoot = file('../..')
def modProperties = new Properties()
file('../../gradle.properties').withInputStream { modProperties.load(it) }
version = modProperties.mod_version
group = 'com.timestop.integration'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${modProperties.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${modProperties.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${modProperties.fabric_version}"
    modImplementation "dev.ryanhcode.sable:sable-fabric-${modProperties.minecraft_version}:${modProperties.sable_version}"
    modCompileOnly "dev.emi:trinkets:${modProperties.trinkets_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

sourceSets {
    main {
        java.srcDirs = [new File(modRoot, 'common/src/main/java'), new File(modRoot, 'fabric/src/main/java')]
        resources.srcDirs = [new File(modRoot, 'common/src/main/resources'), new File(modRoot, 'fabric/src/main/resources')]
    }
    sabletest {
        java.srcDirs = [new File(modRoot, 'fabric/src/sabletest/java')]
        resources.srcDirs = [new File(modRoot, 'fabric/src/sabletest/resources')]
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mixin { defaultRefmapName = 'timestop.refmap.json' }
    mods {
        timestop { sourceSet sourceSets.main }
        timestop_sable_tests { sourceSet sourceSets.sabletest }
    }
    runs {
        sableGametest {
            server()
            source sourceSets.sabletest
            vmArg '-Dfabric-api.gametest'
            runDir 'build/sable-gametest-run'
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    eachFile { details ->
        if (details.path.startsWith('data/')) {
            details.path = details.path.replace('/recipes/', '/recipe/').replace('/structures/', '/structure/').replace('/loot_tables/', '/loot_table/').replace('/tags/blocks/', '/tags/block/').replace('/tags/items/', '/tags/item/')
        }
    }
}
