buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.24,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

base {
    archivesName = "${project.archives_name}-forge-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').file('src/main/java')
        }
        resources {
            srcDirs += project(':common').file('src/main/resources')
        }
    }
}

minecraft {
    mappings channel: 'official', version: "${project.minecraft_version}"
    copyIdeResources = false
    runs {
        server {
            workingDirectory project.file('build/server-smoke-run')
            args '--nogui'
            mods { timestop { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('build/client-smoke-run')
            mods { timestop { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-52.1.16"
    compileOnly project(':common')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'timestop.refmap.json'
    config 'timestop-common.mixins.json'
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title': 'timestop',
            'Specification-Vendor': 'timestop',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'timestop',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'timestop-common.mixins.json'
        ])
    }
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    eachFile { details ->
        if (details.path.startsWith('data/')) {
            details.path = details.path.replace('/recipes/', '/recipe/').replace('/structures/', '/structure/').replace('/loot_tables/', '/loot_table/').replace('/tags/blocks/', '/tags/block/').replace('/tags/items/', '/tags/item/')
        }
    }
}

// Forge's module layer requires the dev mod's classes and resources in one directory.
sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory

// Opt-in client regression scene; QA classes never enter the distribution JAR.
sourceSets {
    visualQa {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
sourceSets.visualQa.output.resourcesDir = sourceSets.visualQa.java.destinationDirectory
if (project.hasProperty('fieldVisualQa')) {
    minecraft.runs.client {
        workingDirectory project.file('build/field-visual-run')
        args '--width', '1280', '--height', '800'
        mods { timestop_visualqa { source sourceSets.visualQa } }
    }
}
