plugins {
    id 'fabric-loom'
}

loom {
    mixin {
        defaultRefmapName = "timestop.refmap.json"
    }
    mods {
        timestop {
            sourceSet sourceSets.main
        }
    }
}

base {
    archivesName = "${project.archives_name}-fabric-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').file('src/main/java')
        }
        resources {
            srcDirs += project(':common').file('src/main/resources')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly project(':common')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    eachFile { details ->
        if (details.path.startsWith('data/')) {
            details.path = details.path.replace('/recipes/', '/recipe/').replace('/structures/', '/structure/').replace('/loot_tables/', '/loot_table/').replace('/tags/blocks/', '/tags/block/').replace('/tags/items/', '/tags/item/')
        }
    }
}

afterEvaluate {
    tasks.named('remapJar') {
        actions.removeIf { it.displayName.contains('copy') }
    }
}


// Regression tests run in an isolated world and are excluded from release JARs.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods { timestop_tests { sourceSet sourceSets.gametest } }
    runs {
        gametest {
            server()
            name 'Time Stop 1.21.1 regression tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            runDir 'build/gametest-run'
        }
    }
}

loom.runs {
    pedestalVisual {
        client()
        source sourceSets.gametest
        vmArg '-Dtimestop.pedestalVisualQa=true'
        programArgs '--width', '1600', '--height', '900'
        runDir 'build/pedestal-visual-run'
    }
}
