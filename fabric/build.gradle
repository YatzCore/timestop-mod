plugins {
    id 'fabric-loom'
}

loom {
    mixin {
        defaultRefmapName = "timestop.refmap.json"
    }
}

base {
    archivesName = "${project.archives_name}-fabric-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').file('src/main/java')
        }
        resources {
            srcDirs += project(':common').file('src/main/resources')
        }
    }
}

dependencies {
    modCompileOnly "dev.emi:trinkets:${project.trinkets_version}"
    if (providers.gradleProperty('accessoryRuntime').orElse('true').get().toBoolean()) {
        // The official 1.20.1 release has correctly remapped client mixin shadows.
        modLocalRuntime "maven.modrinth:trinkets:AHxQGtuC"
        // Loom flattens dependencies; use CCA modules directly in development.
        modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-base:5.2.3"
        modLocalRuntime "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:5.2.3"
    }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly project(':common')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

afterEvaluate {
    tasks.named('remapJar') {
        actions.removeIf { it.displayName.contains('copy') }
    }
}
// Isolated Fabric GameTests; never included in the distributable mod.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        timestop { sourceSet sourceSets.main }
        timestop_tests { sourceSet sourceSets.gametest }
    }
    runs {
        predictionVisual {
            client()
            name 'Time Prediction visual QA (isolated world)'
            source sourceSets.gametest
            vmArg '-Dtimestop.predictionVisualQa=true'
            programArgs '--width', '1600', '--height', '900'
            runDir 'build/prediction-visual-run'
        }
        watchRadiusVisual {
            client()
            name 'Creative Watch radius UI QA (isolated world)'
            source sourceSets.gametest
            vmArg '-Dtimestop.radiusVisualQa=true'
            programArgs '--width', '1600', '--height', '900'
            runDir 'build/watch-radius-visual-run'
        }
        gametest {
            server()
            name 'Time Stop regression tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            runDir 'build/gametest-run'
        }
        pedestalVisual {
            client()
            name 'Pedestal visual QA (isolated world)'
            source sourceSets.gametest
            vmArg '-Dtimestop.pedestalVisualQa=true'
            programArgs '--width', '1600', '--height', '900'
            runDir 'build/pedestal-visual-run'
        }
        observatoryVisual {
            client()
            name 'Observatory visual QA (isolated world)'
            source sourceSets.gametest
            vmArg '-Dtimestop.observatoryVisualQa=true'
            programArgs '--width', '1600', '--height', '900'
            runDir 'build/observatory-visual-run'
        }
        observatoryNatural {
            client()
            name 'Observatory natural generation QA (isolated world)'
            source sourceSets.gametest
            vmArg '-Dtimestop.observatoryVisualQa=true'
            vmArg '-Dtimestop.observatoryNaturalQa=true'
            programArgs '--width', '1600', '--height', '900'
            runDir 'build/observatory-natural-run'
        }
    }
}
