plugins {
    id 'fabric-loom'
}

loom {
    mixin {
        defaultRefmapName = "timestop.refmap.json"
    }
}

base {
    archivesName = "${project.archives_name}-fabric-${project.minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').file('src/main/java')
        }
        resources {
            srcDirs += project(':common').file('src/main/resources')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly project(':common')
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

afterEvaluate {
    tasks.named('remapJar') {
        actions.removeIf { it.displayName.contains('copy') }
    }
}
// Isolated Fabric GameTests; never included in the distributable mod.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        timestop { sourceSet sourceSets.main }
        timestop_tests { sourceSet sourceSets.gametest }
    }
    runs {
        gametest {
            server()
            name 'Time Stop regression tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            runDir 'build/gametest-run'
        }
    }
}
