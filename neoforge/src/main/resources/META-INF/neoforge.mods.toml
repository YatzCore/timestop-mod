modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/YatzCore/timestop-mod/issues"

[[mods]]
modId="timestop"
version="${version}"
displayName="Ultimate Time Stop"
authors="YatzCore"
description='''
A true engine-level Mixin Time Stop mod. Freezes all entities, block entities, weather, day/night cycles, fluids, and projectiles in mid-air. Features 6 temporal modes (Time Stop, Slow-Mo, Matrix, Superhot, Deceleration Field, Fast Forward), tiered watches, and socketable temporal runes!
'''
logoFile="logo.png"

[[mixins]]
config="timestop-common.mixins.json"

[[mixins]]
config="timestop-neoforge.mixins.json"

[[dependencies.timestop]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.timestop]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.21.2)"
    ordering="NONE"
    side="BOTH"
