plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.78' apply false
}

subprojects {
    apply plugin: 'java'

    version = project.mod_version
    group = 'com.timestop'

    repositories {
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
        maven { url = 'https://maven.terraformersmc.com/releases'; content { includeGroup 'dev.emi' } }
        maven { url = 'https://maven.theillusivec4.top/'; content { includeGroup 'top.theillusivec4.curios' } }
        maven { url = 'https://maven.ladysnake.org/releases'; content { includeGroup 'dev.emi'; includeGroup 'dev.onyxstudios.cardinal-components-api'; includeGroup 'org.ladysnake.cardinal-components-api' } }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}
