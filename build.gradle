buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.24,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'

version = '1.4.0'
group = 'com.timestop'

base {
    archivesName = 'timestop-1.21.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Opt-in integration tests run in a separate disposable world, never in a player save.
if (project.hasProperty('portChecks')) {
    sourceSets.main.java.srcDir 'src/gameTest/java'
    sourceSets.main.java.exclude '**/TimeStopRegressionTests.java'
    sourceSets.main.resources.srcDir 'src/gameTest/resources'
    // Forge's module scanner needs test classes and mods.toml in one output root.
    sourceSets.main.java.destinationDirectory.set(layout.buildDirectory.dir('port-test-classes'))
    sourceSets.main.output.resourcesDir = file('build/port-test-classes')
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true

    runs {
        gameTestServer {
            workingDirectory project.file('build/port-test-run')
            property 'forge.enabledGameTestNamespaces', 'timestop'
            mods {
                timestop { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                timestop {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                timestop {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.16'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'timestop.refmap.json'
    config 'timestop.mixins.json'
}

tasks.named('jar', Jar) {
    exclude 'com/timestop/PortRegressionTests*.class'
    exclude 'com/timestop/TimeStopRegressionTests*.class'
    exclude 'com/timestop/TimeStopTaczTests*.class'
    exclude 'data/timestop/structures/empty.nbt'
    exclude 'data/timestop/structure/empty.nbt'
    manifest {
        attributes([
            'Specification-Title': 'timestop',
            'Specification-Vendor': 'timestop',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'timestop',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'timestop.mixins.json'
        ])
    }
}

tasks.named('processResources') {
    // These datapack directories became singular in Minecraft 1.21.
    eachFile { details ->
        if (details.path.startsWith('data/')) {
            details.path = details.path.replace('/recipes/', '/recipe/').replace('/structures/', '/structure/')
        }
    }
}

tasks.register('deployToMods', Copy) {
    dependsOn 'jar'
    from tasks.named('jar').flatMap { it.archiveFile }
    into file('../mods')
}
